<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My CV</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f3f5f9;--card:#fff;--tx:#1b1f27;--mu:#667085;--bd:#dce2eb;--pr:#3157c8;--prt:#fff;--sh:0 8px 24px rgba(23,32,51,.06);color-scheme:light}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14171c;--card:#1e222a;--tx:#e8ebf0;--mu:#98a2b3;--bd:#343a46;--pr:#6b95ff;--prt:#0d1117;--sh:0 8px 24px rgba(0,0,0,.18);color-scheme:dark}}
:root[data-theme="dark"]{--bg:#14171c;--card:#1e222a;--tx:#e8ebf0;--mu:#98a2b3;--bd:#343a46;--pr:#6b95ff;--prt:#0d1117;--sh:0 8px 24px rgba(0,0,0,.18);color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;background:radial-gradient(ellipse at 50% -180px,rgba(49,87,200,.1),transparent 60%),var(--bg);color:var(--tx);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Arial,"Noto Sans Khmer","Khmer OS","Leelawadee UI",sans-serif}
header.top{display:flex;flex-wrap:wrap;gap:14px 24px;align-items:center;justify-content:space-between;padding:14px clamp(16px,3vw,36px);background:var(--card);box-shadow:0 1px 0 var(--bd)}
h1.app{font-size:clamp(16px,1.8vw,20px);margin:0;font-weight:700}
.tabs,.top-actions{display:flex;gap:6px}
.top-actions{flex-wrap:wrap;justify-content:flex-end;gap:8px}
button{font:inherit;font-weight:600;cursor:pointer;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:9px;padding:8px 13px;min-height:40px}
button:hover:not(:disabled){border-color:var(--pr)}
button:disabled{cursor:wait;opacity:.7}
button.on,button.pri{background:var(--pr);color:var(--prt);border-color:var(--pr)}
:focus-visible{outline:3px solid rgba(49,87,200,.4);outline-offset:2px}
main.wrap{display:grid;grid-template-columns:minmax(310px,390px) minmax(0,1fr);gap:20px;padding:clamp(14px,2.4vw,30px);max-width:1440px;margin:0 auto}
@media(max-width:900px){main.wrap{grid-template-columns:minmax(0,1fr);max-width:760px}}
.panel{background:var(--card);border:1px solid var(--bd);border-radius:15px;padding:clamp(14px,1.7vw,20px);box-shadow:var(--sh)}
.panel h2{font-size:12px;margin:0 0 13px;text-transform:uppercase;letter-spacing:.09em;color:var(--mu)}
label{display:block;font-size:12px;font-weight:600;color:var(--mu);margin:13px 0 5px}
input,textarea,select{width:100%;min-width:0;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:9px;padding:9px 11px}
input:focus,textarea:focus,select:focus{border-color:var(--pr);outline:none;box-shadow:0 0 0 3px rgba(49,87,200,.12)}
textarea{resize:vertical;min-height:84px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.row select{width:auto;flex:1;min-width:0}
.grid{margin-top:10px;max-height:360px;overflow-y:auto;padding:2px}
.cg{font-size:12px;font-weight:600;color:var(--mu);margin:10px 0 4px}
.tg{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.grid button.th{padding:5px;height:auto;display:flex;flex-direction:column;align-items:center;border:2px solid var(--bd);background:var(--bg);border-radius:9px}
.th svg{width:100%;height:auto;display:block}
.th small{font-size:10px;color:var(--mu);margin-top:2px}
.grid button.th.on{border-color:var(--pr);box-shadow:0 0 0 1px var(--pr)}
.hint{font-size:12px;color:var(--mu);margin:8px 0 0}
.hint:empty{display:none}
.type-hint{padding:8px 10px;border-radius:8px;background:var(--bg);font-weight:600}
.stage{min-width:0;overflow-x:auto;padding:12px;border:1px solid var(--bd);border-radius:15px;background:rgba(255,255,255,.38)}
.paper{--ac-deep:#19314d;background:linear-gradient(to bottom,transparent calc(297mm - 2px),rgba(225,60,60,.55) calc(297mm - 2px)) 0 0/100% 297mm repeat-y,#fff;color:#222;width:210mm;min-height:297mm;margin:0 auto;box-shadow:0 8px 28px rgba(16,24,40,.18);font-size:13px;line-height:1.45;overflow:hidden}
.paper h1{margin:0;font-size:2em;line-height:1.15}
.paper h3{margin:14px 0 5px;font-size:.85em;text-transform:uppercase;letter-spacing:.08em;color:var(--ac-ink,var(--ac));border-bottom:1px solid var(--ac);padding-bottom:2px;break-after:avoid}
.paper p{margin:3px 0}.paper ul{margin:3px 0 0;padding-left:18px}.paper li{margin:1px 0}
.paper section{margin:0 0 12px}
.paper .it{margin-bottom:8px;break-inside:avoid}
.paper .ti{color:var(--ac-ink,var(--ac));font-weight:600;font-size:1.1em}
.paper .ct{font-size:.9em;color:#555;overflow-wrap:anywhere}
.ph{width:100px;height:100px;border-radius:50%;object-fit:cover;border:3px solid var(--ac);display:block;margin:0 auto 10px}
.h2 .ph{border-color:#fff}.h2 .ph,.h3 .ph,.tl .ph{margin:0 0 10px}
.g1 aside .ph{border-color:#fff;margin:0 auto 12px}
.paper[data-c="0"] h1{text-transform:uppercase;letter-spacing:.05em}
.paper[data-c="0"] h3{border-bottom-width:2px;letter-spacing:.14em}
.paper[data-c="1"] h3{background:var(--ac-soft);border:0;border-left:3px solid var(--ac);padding:3px 8px}
.paper[data-c="2"] h3{border:0;border-left:4px solid var(--ac);padding:0 0 0 7px;font-weight:800}
.paper[data-c="3"] h1{font-weight:400;letter-spacing:.06em}
.paper[data-c="3"] h3{text-align:center;letter-spacing:.22em;border-bottom-style:dotted}
.sk{display:flex;flex-wrap:wrap;gap:5px}
.sk span{border:1px solid var(--ac);color:var(--ac-ink,var(--ac));border-radius:99px;padding:1px 9px;font-size:.9em}
.h0{text-align:center;padding:30px 36px 0}
.pad,.body{padding:0 36px 30px}
.g1{display:grid;grid-template-columns:34% 1fr;min-height:297mm}
.g1 aside{background:var(--ac-soft);color:#222;padding:30px 18px}
.g1 aside h1{font-size:1.6em}
.g1 aside .ti,.g1 aside h3{color:var(--ac-ink,var(--ac))}
.g1 aside h3{border-color:var(--ac)}
.g1 aside .ct{color:#4b5563}
.g1 aside .sk span{color:var(--ac);border-color:var(--ac)}
.g1 main{padding:30px 24px}
.h2{background:var(--ac-soft);color:#222;padding:30px 36px;margin-bottom:6px;border-bottom:3px solid var(--ac)}
.h2 .ti{color:var(--ac-ink,var(--ac))}.h2 .ct{color:#4b5563}
.h3{padding:30px 36px 0}
.h3 .in{border-left:6px solid var(--ac);padding-left:14px}
.g3{display:grid;grid-template-columns:1fr 32%;gap:18px;padding:0 36px 30px}
.g3>:last-child{align-self:start;padding:12px 14px;background:var(--ac-soft);border-top:2px solid var(--ac)}
.tl .h0{text-align:left;padding:24px 36px 16px;background:var(--ac-soft);border-bottom:2px solid var(--ac)}
.tl .it{border-left:2px solid var(--ac);padding-left:12px;position:relative}
.tl .it::before{content:"";position:absolute;left:-6px;top:4px;width:10px;height:10px;border-radius:50%;background:var(--ac)}
.letter .lh{padding:30px 36px 14px}.letter .lb{padding:10px 36px 36px}.letter .lb p{margin:0 0 10px}
.lh.c{text-align:center;border-bottom:3px solid var(--ac);background:var(--ac-soft)}
.lh.b{background:var(--ac-soft);color:#222;border-bottom:3px solid var(--ac)}
.lh.b .ti{color:var(--ac-ink,var(--ac))}.lh.b .ct{color:#4b5563}
.lh.s{border-left:6px solid var(--ac);margin:30px 36px 0;padding:0 0 0 14px}
/* layout themes */
.paper[data-layout="0"] .h0{padding:22px 36px 16px;border-top:9px solid var(--ac-deep);border-bottom:1px solid var(--bd);background:linear-gradient(120deg,var(--ac-soft),#fff 72%)}
.paper[data-layout="0"] .h0 h1{letter-spacing:.025em}
.paper[data-layout="1"] .g1 aside{background:var(--ac-deep);color:#fff}
.paper[data-layout="1"] .g1 aside .ti,.paper[data-layout="1"] .g1 aside h3,.paper[data-layout="1"] .g1 aside .sk span{color:#fff}
.paper[data-layout="1"] .g1 aside .ct{color:rgba(255,255,255,.82)}
.paper[data-layout="1"] .g1 aside h3{border-color:rgba(255,255,255,.48)}
.paper[data-layout="1"] .g1 aside .sk span{border-color:rgba(255,255,255,.62);background:rgba(255,255,255,.08)}
.paper[data-layout="1"] .g1 aside .ph{border-color:rgba(255,255,255,.85)}
.paper[data-layout="1"] .g1 main{padding-left:28px}
.paper[data-layout="2"] .h2{background:linear-gradient(115deg,var(--ac-deep),var(--ac));color:#fff;border:0;border-bottom:5px solid var(--ac-soft)}
.paper[data-layout="2"] .h2 .ti,.paper[data-layout="2"] .h2 .ct{color:#fff}
.paper[data-layout="2"] .h2 .ph{border-color:rgba(255,255,255,.85)}
.paper[data-layout="2"] .pad{padding-top:14px}
.paper[data-layout="3"] .h3 .in{border-left:9px solid var(--ac-deep);background:linear-gradient(105deg,var(--ac-soft),#fff 82%);padding:18px 22px}
.paper[data-layout="3"] .g3>:last-child{background:var(--ac-deep);color:#fff;border-top:0;border-radius:8px;padding:14px 16px}
.paper[data-layout="3"] .g3>:last-child h3,.paper[data-layout="3"] .g3>:last-child .sk span{color:#fff;border-color:rgba(255,255,255,.66)}
.paper[data-layout="3"] .g3>:last-child h3{border-bottom-color:rgba(255,255,255,.45)}
.paper[data-layout="3"] .g3>:last-child .ct{color:rgba(255,255,255,.82)}
.paper[data-layout="4"] .tl .h0{border-top:7px solid var(--ac-deep);background:linear-gradient(110deg,var(--ac-soft),#fff 76%);padding:22px 36px 18px}
.paper[data-layout="4"] .tl .it{border-left-color:var(--ac-deep)}
.paper[data-layout="4"] .tl .it::before{background:var(--ac-deep);box-shadow:0 0 0 3px var(--ac-soft)}
.paper[data-layout="4"] .body>section>h3{display:inline-block;min-width:150px;padding:3px 9px;background:var(--ac-soft);border:0;border-left:3px solid var(--ac-deep);color:var(--ac-ink)}
.sample{display:grid;grid-template-columns:32% 68%;min-height:297mm;background:#f4f5f7}
.sample-side{background:#39383b;color:#fff;padding:30px 20px;border-top:6px solid var(--ac)}
.sample-photo{margin:-30px -20px 24px;padding:24px 18px 20px;background:var(--ac)}
.sample-photo .ph{width:88px;height:88px;border:5px solid #f4d34f;margin:0 auto}
.sample-photo:empty{display:none}
.sample-side h3{margin-top:18px;color:#fff;border:0;border-bottom:3px solid var(--ac);padding-bottom:5px;letter-spacing:0;text-transform:none;font-size:1em}
.sample-side .ct{color:rgba(255,255,255,.85);font-size:.85em}
.sample-side .sk{display:grid;gap:7px}
.sample-side .sk span{color:#fff;border:0;border-bottom:1px solid rgba(255,255,255,.55);border-radius:0;padding:2px 4px;text-align:center}
.sample-side .sample-langs p{margin:5px 0;font-size:.9em}
.sample-main{min-width:0}
.sample-head{padding:25px 25px 18px;background:#39383b;color:#fff;border-top:6px solid var(--ac)}
.sample-head h1{font-size:1.8em}
.sample-head .ti,.sample-head .ct{color:#fff}
.sample-head .ct{margin-top:8px;font-size:.78em}
.sample-content{padding:8px 24px 28px}
.sample-content section{margin-bottom:14px}
.sample-content h3{margin-top:10px;border-bottom:2px solid var(--ac);color:#38383a;letter-spacing:.04em}
@media(max-width:600px){.sample{grid-template-columns:34% 66%}.sample-side{padding:20px 12px}.sample-photo{margin:-20px -12px 18px}.sample-head{padding:20px 16px 14px}.sample-content{padding:8px 16px 24px}}
.editorial{padding:34px 38px}
.editorial-head{display:grid;grid-template-columns:1fr auto;align-items:end;gap:18px;border-bottom:2px solid var(--ac);padding-bottom:18px}
.editorial-head h1{font:700 2.25em/1.05 Georgia,"Times New Roman",serif}
.editorial-head .ti{margin-top:8px}
.editorial-head .ph{grid-column:2;grid-row:1/3;width:76px;height:76px}
.editorial-meta{font-size:.82em;color:#555;margin-top:12px}
.editorial-content{padding-top:12px}
.editorial-content h3{font:700 .9em Georgia,"Times New Roman",serif;letter-spacing:.12em}
.minimalcv{padding:38px 42px}
.minimalcv-head{border-left:5px solid var(--ac);padding-left:18px;margin-bottom:28px}
.minimalcv-head .ph{float:right;width:76px;height:76px}
.minimalcv-head h1{font-size:2em}
.minimalcv-head .ct{margin-top:12px}
.minimalcv-content{clear:both}
.minimalcv-content h3{border:0;border-top:1px solid #bbb;padding-top:8px;color:#333}
.compactcv{padding:30px 36px}
.compactcv-head{display:grid;grid-template-columns:1fr auto;gap:3px 20px;align-items:center;padding-bottom:14px;border-bottom:4px solid var(--ac)}
.compactcv-head h1{font-size:1.85em}
.compactcv-head .ti{grid-column:1}
.compactcv-head .ct{grid-column:2;grid-row:1/3;text-align:right;max-width:210px;font-size:.8em}
.compactcv-head .ph{grid-column:2;grid-row:1/3;width:64px;height:64px}
.compactcv-content{padding-top:10px}
.compactcv-content section{margin-bottom:8px}
.compactcv-content h3{margin:8px 0 3px}
.boldcv{padding:0 36px 30px}
.boldcv-head{margin:0 -36px 18px;padding:34px 36px 24px;background:var(--ac-deep);color:#fff;border-top:8px solid var(--ac)}
.boldcv-head .ph{float:right;width:82px;height:82px;border-color:#fff}
.boldcv-head h1{font-size:2.2em}
.boldcv-head .ti,.boldcv-head .ct{color:rgba(255,255,255,.9)}
.boldcv-head .ct{margin-top:10px}
.boldcv-content h3{border-left:4px solid var(--ac);padding-left:9px}
@media(max-width:600px){.editorial,.minimalcv,.compactcv{padding:24px}.boldcv{padding:0 24px 24px}.boldcv-head{margin:0 -24px 16px;padding:26px 24px 20px}.editorial-head{gap:10px}}
.paper[data-layout="2"] .letter .lh.b{background:linear-gradient(115deg,var(--ac-deep),var(--ac));border:0;border-bottom:5px solid var(--ac-soft);color:#fff}
.paper[data-layout="2"] .letter .lh.b .ti,.paper[data-layout="2"] .letter .lh.b .ct{color:#fff}
.paper[data-layout="3"] .letter .lh.s{background:linear-gradient(105deg,var(--ac-soft),#fff 82%);border-left-color:var(--ac-deep);border-radius:0 8px 8px 0;padding:16px 20px}
.paper[data-layout="0"] .letter .lh.c{border-top:9px solid var(--ac-deep);background:linear-gradient(120deg,var(--ac-soft),#fff 72%)}
.paper[data-layout="1"] .letter .lh{border-left:9px solid var(--ac-deep);background:var(--ac-soft);padding-left:22px}
.paper[data-layout="4"] .letter .lh{background:linear-gradient(110deg,var(--ac-soft),#fff 76%);border-top:7px solid var(--ac-deep);text-align:left}
/* payment modal */
.pay-bg{position:fixed;inset:0;background:rgba(0,0,0,.55);display:none;align-items:center;justify-content:center;z-index:99;padding:14px}
.pay-bg.open{display:flex}
.pay{background:var(--card);color:var(--tx);border-radius:14px;max-width:420px;width:100%;max-height:92vh;overflow:auto;padding:18px}
.pay h2{margin:0 0 8px;font-size:17px;text-transform:none;letter-spacing:0;color:var(--tx)}
.pay img.qr{width:100%;max-width:300px;display:block;margin:8px auto;border-radius:10px}
.pay .st{font-size:13px;margin:12px 0 4px;font-weight:700}
.pay #proofPrev{max-width:100%;max-height:160px;margin-top:8px;border-radius:8px;display:none}
@media(max-width:640px){.top-actions{width:100%}.top-actions>.tabs{flex:1 1 0}.top-actions>.tabs button{flex:1}.top-actions>#print{flex:1 0 100%}}
@media(max-width:420px){.tg{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media print{
body *{visibility:hidden}
.paper,.paper *{visibility:visible}
.paper{position:absolute;left:0;top:0;width:210mm;max-width:none;min-height:297mm;height:auto;overflow:visible;box-shadow:none;background:#fff;print-color-adjust:exact;-webkit-print-color-adjust:exact;zoom:1!important}
body:not(.paid) .paper{display:none!important}
@page{size:A4;margin:0}}
</style>
</head>
<body>
<header class="top">
<h1 class="app" id="happ">CV &amp; Cover Letter Builder</h1>
<div class="row top-actions">
<div class="tabs"><button id="len" class="on">English</button><button id="lkm">ខ្មែរ</button></div>
<div class="tabs"><button id="tcv" class="on">CV</button><button id="tcl">Cover letter</button></div>
<button class="pri" id="print">Save PDF</button>
</div>
</header>
<main class="wrap">
<div>
<div class="panel">
<h2><span id="ttpl">Template</span> <span id="tname"></span></h2>
<div class="row"><button id="auto" class="pri">Random</button><button id="prev">←</button><select id="cat"></select><select id="flt"></select><button id="next">→</button></div>
<div class="grid" id="grid"></div>
<p class="hint" id="hint"></p>
<p class="hint" id="autoHint" aria-live="polite"></p>
<p class="hint type-hint" id="typeHint" aria-live="polite"></p>
</div>
<div class="panel" style="margin-top:16px"><h2 id="ftitle">Your details</h2><div id="form"></div></div>
</div>
<div class="stage">
<p class="hint" style="text-align:center;margin:0 0 8px">A4 · 210 × 297 mm · red line = page break</p>
<div class="paper" id="paper"></div>
</div>
</main>

<div class="pay-bg" id="payBg"><div class="pay">

const langSection=sec(T('langs'),ls(d.langs));
let sk=skillSection+langSection;
if(t.l===5)return`<div class="sample"><aside class="sample-side"><div class="sample-photo">${ph}</div>${sec(T('skills'),d.skills?`<div class="sk">${d.skills.split(',').map(s=>s.trim()).filter(Boolean).map(s=>`<span>${esc(s)}</span>`).join('')}</div>`:'')}${d.langs?`<section class="sample-langs"><h3>${T('langs')}</h3>${ls(d.langs)}</section>`:''}</aside><div class="sample-main"><header class="sample-head"><h1>${esc(d.name)}</h1><p class="ti">${esc(d.title)}</p><p class="ct">${ct.join(' · ')}</p></header><main class="sample-content">${sum}${edu}${exp}</main></div></div>`;
if(t.l===6)return`<div class="editorial"><header class="editorial-head"><div><h1>${esc(d.name)}</h1><p class="ti">${esc(d.title)}</p></div>${ph}</header><p class="editorial-meta">${ct.join(' · ')}</p><main class="editorial-content">${sum}${exp}${edu}${sk}</main></div>`;
if(t.l===7)return`<div class="minimalcv"><header class="minimalcv-head">${ph}<h1>${esc(d.name)}</h1><p class="ti">${esc(d.title)}</p><p class="ct">${ct.join(' · ')}</p></header><main class="minimalcv-content">${sum}${exp}${edu}${sk}</main></div>`;
if(t.l===8)return`<div class="compactcv"><header class="compactcv-head">${ph}<h1>${esc(d.name)}</h1><p class="ti">${esc(d.title)}</p><p class="ct">${ct.join(' · ')}</p></header><main class="compactcv-content">${sum}${exp}${edu}${sk}</main></div>`;
if(t.l===9)return`<div class="boldcv"><header class="boldcv-head">${ph}<h1>${esc(d.name)}</h1><p class="ti">${esc(d.title)}</p><p class="ct">${ct.join(' · ')}</p></header><main class="boldcv-content">${sum}${exp}${edu}${sk}</main></div>`;
switch(t.l){
case 1:return`<div class="g1"><aside>${head}<p class="ct">${ct.join('<br>')}</p>${sk}</aside><main>${sum}${exp}${edu}</main></div>`;
case 2:return`<div class="h2">${head}<p class="ct">${ct.join(' · ')}</p></div><div class="pad">${sum}${exp}${edu}${sk}</div>`;
case 3:return`<div class="h3"><div class="in">${head}<p class="ct">${ct.join(' · ')}</p></div></div><div class="g3"><div>${sum}${exp}</div><div>${edu}${sk}</div></div>`;
case 4:return`<div class="tl"><div class="h0">${head}<p class="ct">${ct.join(' · ')}</p></div><div class="body">${sum}${exp}${edu}${sk}</div></div>`;
default:return`<div class="h0">${head}<p class="ct">${ct.join(' · ')}</p></div><div class="body">${sum}${exp}${edu}${sk}</div>`}}
function letter(d,t){
const ct=[d.email,d.phone,d.loc].filter(Boolean).map(esc).join(' · ');
const hd=`<h1>${esc(d.name)}</h1><p class="ti">${esc(d.title)}</p><p class="ct">${ct}</p>`;
const cls=t.l===2?'b':t.l===3?'s':'c';
const date=new Date().toLocaleDateString(S.lang==='km'?'km-KH':'en-GB',{day:'numeric',month:'long',year:'numeric'});
const paras=String(d.body||'').split(/\n\s*\n/).filter(x=>x.trim()).map(p=>`<p>${esc(p)}</p>`).join('');
return`<div class="letter"><div class="lh ${cls}">${hd}</div><div class="lb"><p>${date}</p><p><b>${esc(d.mgr)}</b><br>${esc(d.company)}</p><p><b>${T('re')} ${esc(d.role)}</b></p><p>${T('dear')} ${esc(d.mgr)||T('hm')},</p>${paras}<p>${T('sinc')}<br><b>${esc(d.name)}</b></p></div></div>`}
function render(){
const t=tp(S.tpl),p=$('paper'),ts=TYPE_STYLES[t.l]||TYPE_STYLES[0];
const ff=S.lang==='km'?`"Noto Sans Khmer","Khmer OS",${ts.font}`:ts.font;
p.style.setProperty('--ac',t.ac);p.style.setProperty('--ac-soft',paperTint(t.ac,t.l));p.style.setProperty('--ac-ink',readableAccent(t.ac));p.style.setProperty('--ac-deep',deepAccent(t.ac));p.style.fontFamily=ff;p.style.fontSize=`${ts.size}pt`;
p.innerHTML=S.doc==='cv'?cv(S,t):letter(S,t);
const ci=CAT.findIndex(c=>c[2].includes(Math.floor(S.tpl/LAY.length)));p.dataset.c=ci;p.dataset.layout=t.l;
$('tname').textContent='· '+t.name+' ('+(S.lang==='km'?CAT[ci][1]:CAT[ci][0])+')';
$('autoHint').textContent=autoSelection?`${T('autoSelected')}: ${autoSelection}.`:'';
$('typeHint').textContent=`${T('autoType')}: ${ts.name} · ${ts.size} pt. ${T('typeNote')}`;
document.querySelectorAll('#grid button').forEach(b=>b.classList.toggle('on',+b.dataset.i===S.tpl));fit();save()}
const F={cv:[['name','Full name'],['title','Job title'],['email','Email'],['phone','Phone'],['loc','Location'],['summary','Profile summary','t'],['exp','Experience (blank line between jobs; first line = title, next lines = bullets)','t8'],['edu','Education (blank line between items)','t'],['skills','Skills (comma separated)','t'],['link','Website / LinkedIn'],['proj','Projects (blank line between projects)','t'],['certs','Certifications (one per line)','t'],['langs','Languages (one per line)','t']],
cl:[['name','Your name'],['title','Your job title'],['email','Email'],['phone','Phone'],['loc','Location'],['mgr','Hiring manager'],['company','Company'],['role','Position applied for'],['body','Letter text (blank line = new paragraph)','t10']]};
function form(){
$('ftitle').textContent=S.doc==='cv'?T('d1'):T('d2');
$('form').innerHTML=(S.doc==='cv'?`<label>${T('photo')}</label><div class="row"><input type="file" id="pf" accept="image/*">${S.photo?'<button id="pr">'+T('rm')+'</button>':''}</div>`:'')+F[S.doc==='cv'?'cv':'cl'].map(([k,l,t])=>`<label>${(I[S.lang]||I.en).f[k]||l}</label>`+(t?`<textarea data-k="${k}" rows="${t.slice(1)||3}">${esc(S[k])}</textarea>`:`<input data-k="${k}" value="${esc(S[k])}">`)).join('')}
function init(){
$('grid').onclick=e=>{const b=e.target.closest('button');if(b){clearAuto();S.tpl=+b.dataset.i;render()}};
$('flt').onchange=gal;$('cat').onchange=gal;
$('form').onchange=e=>{if(e.target.id!=='pf')return;const f=e.target.files[0];if(!f)return;clearAuto();const r=new FileReader();r.onload=()=>{const im=new Image();im.onload=()=>{const c=document.createElement('canvas'),n=300,s=Math.min(im.width,im.height);c.width=c.height=n;c.getContext('2d').drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,n,n);S.photo=c.toDataURL('image/jpeg',.85);form();render()};im.src=r.result};r.readAsDataURL(f)};
$('form').onclick=e=>{if(e.target.id==='pr'){clearAuto();S.photo='';form();render()}};
$('auto').onclick=()=>{S.tpl=randomTemplate();autoSelection=tp(S.tpl).name;$('cat').value='all';$('flt').value='all';gal();render()};
$('prev').onclick=()=>{clearAuto();S.tpl=(S.tpl+TEMPLATE_COUNT-1)%TEMPLATE_COUNT;render()};
$('next').onclick=()=>{clearAuto();S.tpl=(S.tpl+1)%TEMPLATE_COUNT;render()};
$('form').oninput=e=>{const k=e.target.dataset.k;if(k){clearAuto();S[k]=e.target.value;render()}};
const tab=d=>{clearAuto();S.doc=d;$('tcv').classList.toggle('on',d==='cv');$('tcl').classList.toggle('on',d==='cl');form();render()};
$('tcv').onclick=()=>tab('cv');$('tcl').onclick=()=>tab('cl');
$('len').onclick=()=>{S.lang='en';ui()};$('lkm').onclick=()=>{S.lang='km';ui()};
/* payment */
$('print').onclick=requestExport;
$('payX').onclick=()=>$('payBg').classList.remove('open');
$('proof').onchange=e=>{const f=e.target.files[0],p=$('proofPrev');if(!f){p.style.display='none';return}p.src=URL.createObjectURL(f);p.style.display='block'};
$('payOk').onclick=()=>{
if(!$('proof').files[0]){$('payMsg').textContent='Please upload your payment confirmation first.';return}
ls2.set('cvb_paid',codeFor(orderId()));
$('payBg').classList.remove('open');document.body.classList.add('paid');doExport()};
window.addEventListener('resize',fit);
ui();tab(S.doc)}
init();
</script>
</body>
</html>
